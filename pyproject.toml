[project]
name = "cathaybk-precondition"
version = "1.0.0"
description = "Pre-interview exercises: two logic problems and an Appium mobile web test"
requires-python = ">=3.10"

[project.optional-dependencies]
appium = ["Appium-Python-Client>=4"]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["program_logic_1", "program_logic_2", "automated_test"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
